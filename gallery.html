<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 作品展覽館 - CNE</title>
  
  <!-- 字型引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --heart: #f43f5e;
      --heart-bg: #fff1f2;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --admin-badge: #7c3aed;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    /* 頂部導覽列 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
    }
    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.15);
    }
    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      box-shadow: none;
    }

    /* 個人資訊 */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px 12px 4px 4px;
      border-radius: 9999px;
    }
    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-pill span {
      font-size: 13px;
      font-weight: 600;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .admin-tag {
      background: var(--admin-badge);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .main-container {
      max-width: 720px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    /* ============================================================
       未登入存取防護門（Login Gate）
    ============================================================ */
    .gate-container {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 50px 24px;
      text-align: center;
      margin: 40px auto;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }
    .gate-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .gate-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .gate-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* ============================================================
       發布區域（登入後可見）
    ============================================================ */
    .publish-section {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 22px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .publish-header-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .dropzone-icon {
      font-size: 30px;
      margin-bottom: 4px;
    }
    .dropzone-text {
      font-size: 13px;
      color: var(--text-muted);
    }
    .dropzone-limit {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .preview-box {
      position: relative;
      width: 100%;
      max-height: 50vh;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      background: #0f172a;
      text-align: center;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 50vh;
      height: auto;
      object-fit: contain; /* 預覽也合比例全圖顯示 */
    }
    .preview-remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus { border-color: var(--primary); }

    /* ============================================================
       貼文卡片：合比例全圖顯示（絕不裁切，個 Mon 睇曬）
    ============================================================ */
    .post-card {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .post-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .post-header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #f1f5f9;
      object-fit: cover;
    }
    .post-meta-name {
      font-weight: 700;
      font-size: 14px;
      display: block;
    }
    .post-meta-date {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    /* 刪除按鈕 */
    .delete-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .delete-btn:hover {
      background: var(--danger);
      color: #fff;
    }
    .delete-btn.admin {
      background: #faf5ff;
      color: #7c3aed;
      border-color: #e9d5ff;
    }
    .delete-btn.admin:hover {
      background: #7c3aed;
      color: #fff;
    }

    /* 圖片容器：背景為深色優雅襯托，合比例置中 */
    .post-image-wrap {
      width: 100%;
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    /* 核心調整：全圖合比例縮小，最高限螢幕 75% 高度，完整顯露無裁切 */
    .post-image-wrap img {
      width: 100%;
      height: auto;
      max-height: 75vh; /* 確保不超出螢幕視野 */
      object-fit: contain; /* 合比例全景，絕不裁剪任何部分 */
      display: block;
    }

    .post-body {
      padding: 16px 20px 20px;
    }
    .post-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    /* 點讚列 */
    .post-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    .like-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .like-btn:hover { background: #f1f5f9; }
    .like-btn.active {
      background: var(--heart-bg);
      color: var(--heart);
      border-color: #fecdd3;
    }

    /* 留言串 */
    .comments-wrapper {
      margin-top: 14px;
    }
    .comment-item {
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .comment-user {
      font-weight: 700;
      margin-right: 6px;
      color: #1e293b;
    }
    .comment-input-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .comment-input-form input {
      flex: 1;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .comment-input-form input:focus {
      background: #fff;
      border-color: var(--primary);
    }

    /* Toast 懸浮提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10001;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="header-inner">
      <a href="./" class="brand">
        <span>✨</span> AI Art Gallery
      </a>
      <div class="header-actions">
        <!-- 未登入 -->
        <button id="nav-login-btn" class="btn">使用 Google 登入</button>
        
        <!-- 已登入 -->
        <div id="user-info" style="display: none; align-items: center; gap: 8px;">
          <div class="user-pill">
            <img id="user-photo" src="" alt="Avatar">
            <span id="user-name"></span>
            <span id="admin-badge" class="admin-tag" style="display: none;">站長</span>
          </div>
          <button id="logout-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">登出</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    
    <!-- ============================================================
         1. 未登入防護門（未登入者僅看得到此區塊，圖庫完全封鎖）
    ============================================================ -->
    <div id="login-gate" class="gate-container">
      <div class="gate-icon">🔒</div>
      <div class="gate-title">私人專屬 AI 藝廊</div>
      <div class="gate-desc">
        本站內容受私隱保護。<br>
        <strong>請先使用 Google 帳號登入，即可瀏覽、刊登及分享您的專屬 AI 作品 ✨</strong>
      </div>
      <button id="gate-login-btn" class="btn" style="padding: 12px 28px; font-size: 15px;">
        立即使用 Google 登入解鎖
      </button>
    </div>

    <!-- ============================================================
         2. 已登入主內容區（只有登入後才會顯示及向資料庫抓取圖片）
    ============================================================ -->
    <div id="authenticated-area" style="display: none;">
      
      <!-- 發布區域 -->
      <div class="publish-section">
        <div class="publish-header-title">
          <span>🎨</span> 發布作品
        </div>

        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon">🖼️</div>
          <div class="dropzone-text"><strong>點擊選擇作品圖片</strong> 或將圖片拖曳至此</div>
          <div class="dropzone-limit">單圖大小上限：5 MB（合比例預覽）</div>
          <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <!-- 圖片合比例預覽框 -->
        <div id="preview-box" class="preview-box">
          <img id="preview-img" src="" alt="預覽圖">
          <button id="preview-remove" class="preview-remove-btn" title="重新選擇">&times;</button>
        </div>

        <input type="text" id="post-title" class="form-input" placeholder="作品標題或名稱（例如：午夜街景）">
        
        <button id="publish-btn" class="btn" style="width: 100%; padding: 12px; border-radius: 12px; font-size: 14px;">
          立即發布到藝廊
        </button>
      </div>

      <!-- 作品展示牆（合比例完整縮放） -->
      <div id="posts-feed">
        <p style="text-align: center; color: var(--text-muted); padding: 40px;">作品載入中...</p>
      </div>

    </div>

  </main>

  <!-- 浮動提示 Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase 模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc,
      onSnapshot, 
      doc, 
      updateDoc, 
      arrayUnion, 
      arrayRemove, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ============================================================
    // 【管理員名單】在此填入你的 Google 登入信箱
    // ============================================================
    const ADMIN_EMAILS = [
      "your_email@gmail.com" // ★ 請替換為你的站長 Gmail
    ];

    // 1. Cloudinary 參數
    const CLOUDINARY_CLOUD_NAME = "sgzzuutu";
    const CLOUDINARY_UPLOAD_PRESET = "ai_gallery_cne";

    // 2. 5MB 大小限制
    const MAX_FILE_SIZE = 5 * 1024 * 1024;

    // 3. Firebase 專案金鑰 (rb-1997)
    const firebaseConfig = {
      apiKey: "AIzaSyDUcN7Is1mbl-pGdzOdTrsdoDfCbl0D3S0",
      authDomain: "rb-1997.firebaseapp.com",
      projectId: "rb-1997",
      storageBucket: "rb-1997.firebasestorage.app",
      messagingSenderId: "788852675325",
      appId: "1:788852675325:web:9e1e305081c3fa9019e494",
      measurementId: "G-MM9DE4R2C5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let selectedFile = null;
    let unsubscribePosts = null; // 即時監聽控制器

    // DOM 元素
    const navLoginBtn = document.getElementById("nav-login-btn");
    const gateLoginBtn = document.getElementById("gate-login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const userPhoto = document.getElementById("user-photo");
    const userName = document.getElementById("user-name");
    const adminBadge = document.getElementById("admin-badge");
    const loginGate = document.getElementById("login-gate");
    const authenticatedArea = document.getElementById("authenticated-area");
    const postsFeed = document.getElementById("posts-feed");
    const toastEl = document.getElementById("toast");

    // 發布區域元素
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const previewBox = document.getElementById("preview-box");
    const previewImg = document.getElementById("preview-img");
    const previewRemove = document.getElementById("preview-remove");
    const postTitle = document.getElementById("post-title");
    const publishBtn = document.getElementById("publish-btn");

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 3000);
    }

    function isUserAdmin(user) {
      return user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase());
    }

    // ============================================================
    // 嚴格監聽登入狀態：未登入者完全不讀取資料
    // ============================================================
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        // 已登入：解鎖主內容，開啟即時監聽
        navLoginBtn.style.display = "none";
        userInfo.style.display = "flex";
        userName.textContent = user.displayName || "創作者";
        userPhoto.src = user.photoURL || "https://www.gravatar.com/avatar/?d=mp";

        if (isUserAdmin(user)) {
          adminBadge.style.display = "inline-block";
        } else {
          adminBadge.style.display = "none";
        }

        loginGate.style.display = "none";
        authenticatedArea.style.display = "block";

        startListeningPosts();
      } else {
        // 未登入：鎖定畫面，切斷讀取
        navLoginBtn.style.display = "inline-flex";
        userInfo.style.display = "none";
        adminBadge.style.display = "none";

        loginGate.style.display = "block";
        authenticatedArea.style.display = "none";

        if (unsubscribePosts) {
          unsubscribePosts();
          unsubscribePosts = null;
        }
        postsFeed.innerHTML = "";
      }
    });

    // 登入
    async function handleLogin() {
      if (window.location.protocol === "file:") {
        alert("【提示】請將此檔案上傳到 GitHub Pages (https://rb-1997.github.io/cne/) 開啟，Google 登入不支援直接雙擊本地檔案。");
        return;
      }
      try {
        await signInWithPopup(auth, provider);
        showToast("登入成功！已解鎖藝廊");
      } catch (err) {
        console.error("登入錯誤：", err);
        if (err.code === "auth/unauthorized-domain") {
          alert("【網域未授權】請確認 Firebase 授權網域中已加入 rb-1997.github.io。");
        } else if (err.code === "auth/popup-blocked") {
          alert("瀏覽器攔截了登入視窗，請允許彈出視窗。");
        } else {
          alert("登入遇到問題：" + err.message);
        }
      }
    }

    navLoginBtn.addEventListener("click", handleLogin);
    gateLoginBtn.addEventListener("click", handleLogin);

    // 登出
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => showToast("已安全登出"));
    });

    // 圖片選取與 5MB 上限防護
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0]) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith("image/")) {
        return alert("請選擇圖片格式檔案！");
      }
      if (file.size > MAX_FILE_SIZE) {
        const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
        alert(`【圖片過大】目前檔案為 ${sizeInMB} MB，上限為 5 MB！請壓縮後再上傳。`);
        fileInput.value = "";
        return;
      }

      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewBox.style.display = "block";
        dropzone.style.display = "none";
      };
      reader.readAsDataURL(file);
    }

    previewRemove.addEventListener("click", () => {
      selectedFile = null;
      fileInput.value = "";
      previewBox.style.display = "none";
      dropzone.style.display = "block";
    });

    // 發布作品
    publishBtn.addEventListener("click", async () => {
      if (!currentUser) return handleLogin();
      if (!selectedFile) return alert("請先選擇一張作品圖片！");

      const title = postTitle.value.trim() || "未命名作品";

      try {
        publishBtn.disabled = true;
        publishBtn.textContent = "上傳圖片至 Cloudinary...";

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        if (!res.ok) throw new Error("圖片上傳失敗，請檢查 Cloudinary 設定。");
        const cloudData = await res.json();
        const imageUrl = cloudData.secure_url;

        publishBtn.textContent = "發布至藝廊中...";

        await addDoc(collection(db, "posts"), {
          title: title,
          imageUrl: imageUrl,
          authorId: currentUser.uid,
          authorName: currentUser.displayName || "創作者",
          authorEmail: currentUser.email || "",
          authorPhoto: currentUser.photoURL || "",
          likes: [],
          comments: [],
          createdAt: serverTimestamp()
        });

        postTitle.value = "";
        selectedFile = null;
        fileInput.value = "";
        previewBox.style.display = "none";
        dropzone.style.display = "block";
        showToast("🎉 作品發布成功！");
      } catch (err) {
        console.error("發布錯誤：", err);
        alert("發布失敗：" + err.message);
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = "立即發布到藝廊";
      }
    });

    // ============================================================
    // 只有在登入後才調用：即時監聽與合比例全圖渲染
    // ============================================================
    function startListeningPosts() {
      if (unsubscribePosts) unsubscribePosts();

      postsFeed.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding:40px;'>作品載入中...</p>";
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      
      unsubscribePosts = onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
          postsFeed.innerHTML = `
            <div style="text-align:center; padding:50px 20px; background:#fff; border-radius:16px; border:1px solid var(--border);">
              <div style="font-size:36px; margin-bottom:10px;">🎨</div>
              <h3 style="font-size:16px; margin-bottom:6px;">目前尚無作品展示</h3>
              <p style="color:var(--text-muted); font-size:13px;">發布第一張作品吧！</p>
            </div>
          `;
          return;
        }

        postsFeed.innerHTML = "";
        const isAdmin = isUserAdmin(currentUser);

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const isLiked = currentUser && post.likes && post.likes.includes(currentUser.uid);
          const likesCount = post.likes ? post.likes.length : 0;
          
          const isAuthor = currentUser && post.authorId === currentUser.uid;
          const canDelete = isAuthor || isAdmin;

          let dateStr = "剛剛";
          if (post.createdAt) {
            const d = post.createdAt.toDate ? post.createdAt.toDate() : new Date(post.createdAt);
            dateStr = d.toLocaleDateString("zh-HK", { month: 'short', day: 'numeric' }) + " " + 
                      d.toLocaleTimeString("zh-HK", { hour: '2-digit', minute: '2-digit' });
          }

          const card = document.createElement("div");
          card.className = "post-card";
          card.innerHTML = `
            <div class="post-header">
              <div class="post-header-user">
                <img class="post-avatar" src="${post.authorPhoto || 'https://www.gravatar.com/avatar/?d=mp'}" alt="Avatar">
                <div>
                  <span class="post-meta-name">${post.authorName}</span>
                  <span class="post-meta-date">${dateStr}</span>
                </div>
              </div>

              ${canDelete ? `
                <button class="delete-btn ${isAdmin && !isAuthor ? 'admin' : ''}" data-id="${postId}" data-author="${post.authorName}">
                  🗑️ ${isAdmin && !isAuthor ? '管理員刪除' : '刪除'}
                </button>
              ` : ''}
            </div>

            <!-- 核心：合比例全景縮放，最高限螢幕 75%，保證一眼完整看到整幅圖 -->
            <div class="post-image-wrap">
              <img src="${post.imageUrl}" alt="${post.title}" loading="lazy">
            </div>

            <div class="post-body">
              <div class="post-title">${post.title}</div>

              <div class="post-actions">
                <button class="like-btn ${isLiked ? 'active' : ''}" data-id="${postId}">
                  <span>${isLiked ? '❤️' : '🤍'}</span> 讚好 (${likesCount})
                </button>
              </div>
              
              <div class="comments-wrapper">
                <div id="comments-${postId}">
                  ${(post.comments || []).map(c => `
                    <div class="comment-item">
                      <span class="comment-user">${c.author}:</span>
                      <span>${c.text}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="comment-input-form">
                  <input type="text" id="input-${postId}" placeholder="留下你的讚賞或交流...">
                  <button class="btn send-comment-btn" data-id="${postId}" style="padding:6px 14px; font-size:12px;">送出</button>
                </div>
              </div>
            </div>
          `;
          postsFeed.appendChild(card);
        });

        bindInteractions();
      }, (err) => {
        console.error("載入失敗：", err);
        postsFeed.innerHTML = "<p style='text-align:center; color:#ef4444; padding:30px;'>載入作品失敗，請確認資料庫權限。</p>";
      });
    }

    // 綁定操作
    function bindInteractions() {
      // 刪除作品
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.onclick = async () => {
          const postId = btn.dataset.id;
          const author = btn.dataset.author;
          const isAdminAction = btn.classList.contains("admin");

          const confirmMsg = isAdminAction
            ? `【管理員審核操作】\n確定要強制刪除作者「${author}」的這部作品嗎？`
            : "確定要刪除你的這部作品嗎？此動作無法復原。";

          if (!confirm(confirmMsg)) return;

          try {
            btn.disabled = true;
            await deleteDoc(doc(db, "posts", postId));
            showToast("作品已成功刪除！");
          } catch (err) {
            console.error("刪除失敗：", err);
            alert("刪除失敗：" + err.message);
          }
        };
      });

      // 點讚
      document.querySelectorAll(".like-btn").forEach(btn => {
        btn.onclick = async () => {
          if (!currentUser) return handleLogin();
          const postId = btn.dataset.id;
          const postRef = doc(db, "posts", postId);
          const hasLiked = btn.classList.contains("active");
          try {
            await updateDoc(postRef, {
              likes: hasLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
          } catch (e) {
            console.error(e);
          }
        };
      });

      // 留言
      document.querySelectorAll(".send-comment-btn").forEach(btn => {
        btn.onclick = async () => {
          if (!currentUser) return handleLogin();
          const postId = btn.dataset.id;
          const input = document.getElementById(`input-${postId}`);
          const val = input.value.trim();
          if (!val) return;

          const postRef = doc(db, "posts", postId);
          try {
            btn.disabled = true;
            await updateDoc(postRef, {
              comments: arrayUnion({
                author: currentUser.displayName || "創作者",
                text: val,
                timestamp: Date.now()
              })
            });
            input.value = "";
          } catch (e) {
            console.error(e);
          } finally {
            btn.disabled = false;
          }
        };
      });
    }
  </script>
</body>
</html>
