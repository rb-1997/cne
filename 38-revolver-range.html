/* ================= 純函數（可抽出做單元測試） ================= */
//__PURE_START__
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function gauss(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pointInPolygon(x,y,poly){var inside=false;for(var i=0,j=poly.length-1;i<poly.length;j=i++){var xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function polyCentroid(poly){var x=0,y=0,i;for(i=0;i<poly.length;i++){x+=poly[i][0];y+=poly[i][1];}return [x/poly.length,y/poly.length];}
function meanPoint(pts){var x=0,y=0,i;for(i=0;i<pts.length;i++){x+=pts[i].x;y+=pts[i].y;}return {x:x/pts.length,y:y/pts.length};}
function distAsp(a,b,aspect){var dx=(a.x-b.x)*aspect,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
function extremeSpread(pts,aspect){var best=0,ba=null,bb=null,i,j;for(i=0;i<pts.length;i++){for(j=i+1;j<pts.length;j++){var d=distAsp(pts[i],pts[j],aspect);if(d>best){best=d;ba=pts[i];bb=pts[j];}}}return {d:best,a:ba,b:bb};}
//__PURE_END__

/* 距離漸進訓練：頭6發7米 → 12發10米 → 12發15米 → 12發25米（共42發） */
function stageDist(fired){
  if(fired<6)return 7;
  if(fired<18)return 10;
  if(fired<30)return 15;
  return 25;
}
function curDist(){return stageDist(S.fired);}
/* 靶紙視覺縮放：物理距離感（近大遠細），指數0.6壓縮免超出屏幕

function curTS(){return Math.pow(25/curDist(),0.6);}
function TW(){return L.tw*curTS();}
function TH(){return L.th*curTS();}
function TX(){return (L.W-TW())/2;}

  click:function(){this.blip(2300,0.05,0.12,'square');},
  tick:function(f){this.blip(f||2800,0.045,0.10,'square');},
  hit:function(){this.blip(740,0.09,0.16);this.blip(1108,0.12,0.10);},

/* ================= 畫布 ================= */
var canvas=document.getElementById('c');
var pc=document.createElement('canvas');   /* 封面像素化（起格紅白機風）用離屏細 canvas */
function rrp(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
var ctx=canvas.getContext('2d');
var IMG=new Image();
var sharpC=null,blurC=null;

/* ================= 狀態 =================
   mode: idle（槍垂低）→ coarse（手指校準彈着點）→ locked（鎖定）
         → fine（精瞄照門）→ 放手開槍 → locked */
var S={
  screen:'loading',timeLeft:TIME_LIMIT,timerOn:false,lastBeep:-1,
  ammo:CYL,loaders:6,fired:0,hits:0,holes:[],
  mode:'idle',aimPid:null,
  tipX:0,tipY:0,lockX:0,lockY:0,
  alignX:0,alignY:0,fineT:0,fatigue:0,swaySX:0,swaySY:0,
  recoil:0,flash:0,smoke:[],
  reloading:false,reloadT:0,
  puffs:[],popups:[],
  magA:0,blurA:0,gunUp:0,notchT:0,
  flip:0,flipping:false,flipT:0,   /* 靶紙翻轉：0=紙背，1=正面 */
  warnT:0,   /* 開始警告「靶出現，開42槍！」倒數 */
  hint:'',hintT:0,endReason:'',stats:null,hasCalibrated:false,
  hold:'center',   /* 瞄準法：center / combat / six（部門標準圖） */
  showHelp:false,menuSel:'start',
  endPhase:null,endT:0   /* 結束序列：showclear(開輪瓜+SHOW CLEAR 2秒) → holster(槍消失 2秒) → results；timeout(開輪瓜 2秒) → results */
};
function holdDy(){return S.hold==='combat'?-0.3:(S.hold==='six'?-0.6:0);}   /* 每種 Hold 嘅理想準星垂直偏移 */
var L={W:0,H:0,dpr:1,u:1,tw:0,th:0,tx:0,ty:0,mx:0,my:0,mr:0,
  loaderRects:[],startBtn:null,restartBtn:null,HUD_Y:96,holdRects:[],menuRects:[],helpBackBtn:null,
  reloadRect:null,stopBtn:null,againBtn:null};

function resetState(){
  S.timeLeft=TIME_LIMIT;S.timerOn=false;S.lastBeep=-1;
  S.ammo=CYL;S.loaders=6;S.fired=0;S.hits=0;S.holes=[];
  S.mode='idle';S.aimPid=null;
  S.tipX=L.W/2;S.tipY=L.H*0.55;S.lockX=L.W/2;S.lockY=L.H*0.55;
  S.alignX=0;S.alignY=0;S.fineT=0;S.fatigue=0;S.swaySX=0;S.swaySY=0;
  S.recoil=0;S.flash=0;S.smoke=[];
  S.reloading=false;S.reloadT=0;S.puffs=[];S.popups=[];
  S.magA=0;S.blurA=0;S.gunUp=0;S.notchT=0;S.warnT=0;
  S.flip=0;S.flipping=false;S.flipT=0;
  S.touched=false;S.endPhase=null;S.endT=0;   /* touched=掂槍嗰下先開始計時＋反靶紙 */
  S.hint='';S.hintT=0;S.endReason='';S.stats=null;S.hasCalibrated=false;
}

/* ================= 小工具 ================= */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function inRect(x,y,r){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function fmtTime(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function showHint(t){S.hint=t;S.hintT=3.0;}
function addPopup(txt,color){S.popups.push({txt:txt,color:color,t:0});}
function clampTip(x,y){return {x:clamp(x,24,L.W-24),y:clamp(y,L.H*0.07,L.H*0.62)};}
/* 槍嘅實際繪製位置（舉槍動畫＋後座） */
function drawTip(){
  var e=easeOutCubic(S.gunUp);
  var idleY=Math.min(L.H*0.60, L.H+30-535*L.u);   /* 起點：腰部 low ready，槍柄可輕微出底邊 */
  return {x:lerp(L.W/2,S.tipX,e), y:lerp(idleY,S.tipY,e)-S.recoil*26};   /* idle 都升返高，等槍柄＋扳機掂到 */
}
function triggerPos(){
  var p=drawTip(),u=L.u;
  return {x:p.x, y:p.y+330*u};   /* 扳機中心（槍座標 0,330） */
}
function triggerHit(x,y){
  var tp=triggerPos();
  return Math.abs(x-tp.x)<44&&Math.abs(y-tp.y)<54;   /* 扳機加大觸控區 */
}
function gripHit(x,y){
  var p=drawTip(),u=L.u;
  var gx=(x-p.x)/u, gy=(y-p.y)/u;
  return gx>-95&&gx<95&&gy>200&&gy<535;   /* 木柄加大觸控區：掂到就郁得支槍 */
}
/* 成支槍觸控區（槍尖到槍柄）：掂邊都當握槍，細機都唔會掂唔中 */
function gunHit(x,y){
  var p=drawTip(),u=L.u;
  var gx=(x-p.x)/u, gy=(y-p.y)/u;
  return gx>-110&&gx<110&&gy>-60&&gy<545;
}
function pressTrigger(){
  if(S.screen!=='play'||S.reloading||S.mode==='fine')return;
  if(S.ammo<=0){AU.click();showHint('冇子彈喇，㩒左上角換彈器');return;}
  if(S.mode==='idle'||S.mode==='coarse'){S.lockX=S.tipX;S.lockY=S.tipY;S.hasCalibrated=true;}
  S.mode='locked';
  enterFine();   /* 撳扳機即刻入精瞄 */
}
function notchPos(){
  var p=drawTip(),u=L.u;
  return {x:p.x, y:p.y+160*u};
}
</script>
<script>
'use strict';
/* ================= 版面 ================= */
function layout(){
  var W=L.W,H=L.H;
  L.u=clamp(Math.min(W,H)/390,0.8,1.5);   /* 用較短邊計：橫屏唔會吹大，平板唔會過細 */
  L.tw=Math.min(W*0.30,200);   /* 25米距離感：明顯縮細，完場驗靶先放大 */L.th=L.tw*(IMG_H/IMG_W); /* 靶紙明顯縮細・25米距離感 */
  L.tx=(W-L.tw)/2;L.ty=H*0.10;
  L.mr=Math.min(W,H)*0.21;L.mx=L.mr+16;L.my=H-L.mr-24;   /* 放大鏡加大，射手視角 */
  L.HUD_Y=96;
  L.loaderRects=[];
  var i;for(i=0;i<6;i++)L.loaderRects.push({x:12+i*34,y:28,w:30,h:28});
  L.startBtn={x:W/2-95,y:H*0.20,w:190,h:58};
  L.restartBtn={x:W/2-95,y:H-76,w:190,h:56};   /* 驗靶頁底部中央 */
  L.helpBackBtn={x:W/2-95,y:H*0.68,w:190,h:52};
  /* 練習時倒數下面兩個掣：停止／重新遊戲（右上，唔冚靶紙） */
  var pbw=Math.max(88,Math.min(126,Math.min(W,H)*0.26)),pbh=Math.max(36,Math.min(46,H*0.052));
  L.stopBtn={x:W-12-pbw,y:66,w:pbw,h:pbh};
  L.againBtn={x:W-12-pbw,y:66+pbh+8,w:pbw,h:pbh};
}
function buildTarget(){
  var dpr=L.dpr,w=Math.max(2,Math.round(TW()*dpr)),h=Math.max(2,Math.round(TH()*dpr));
  sharpC=document.createElement('canvas');sharpC.width=w;sharpC.height=h;
  sharpC.getContext('2d').drawImage(IMG,0,0,w,h);
  blurC=document.createElement('canvas');blurC.width=w;blurC.height=h;
  var b=blurC.getContext('2d');
  try{b.filter='blur('+Math.max(3,Math.round(4*dpr))+'px)';}catch(e){}
  b.drawImage(sharpC,0,0);
  try{b.filter='none';}catch(e){}
}
function resize(){
  var dpr=Math.min(3,window.devicePixelRatio||1);
  L.W=window.innerWidth;L.H=window.innerHeight;L.dpr=dpr;
  canvas.width=Math.round(L.W*dpr);canvas.height=Math.round(L.H*dpr);
  canvas.style.width=L.W+'px';canvas.style.height=L.H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layout();
  if(IMG.complete&&IMG.naturalWidth)buildTarget();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

/* ================= 輸入 ================= */
function tryReload(){
  if(S.reloading||S.screen!=='play')return;
  if(S.mode!=='idle'&&S.mode!=='locked')return;
  if(S.loaders<=0){AU.click();showHint('換彈器用晒喇');return;}
  if(S.ammo>=CYL){showHint('彈巢仲滿');return;}
  S.reloading=true;S.reloadT=0;S.reloadT0=performance.now();S.reloadDur=1200;S.loaders--;AU.reloadSeq();
}
function enterFine(){
  if(S.ammo<=0){AU.click();showHint('冇子彈喇，㩒左上角換彈器');return;}
  S.mode='fine';S.fineT=0;S.fatigue=0;
  S.alignX=(Math.random()*2-1)*0.7;  /* 起手有偏差，要自己修正 */
  S.alignY=(Math.random()*2-1)*0.7;
  S.swaySX=0;S.swaySY=0;
  AU.tick(1800);
  showHint('拖手指郁前準星（後照門唔郁），變綠色就係瞄正');
}
function fire(){
  var wasFine=(S.mode==='fine');
  S.mode='locked';S.aimPid=null;
  if(S.screen!=='play'||S.reloading||!wasFine)return;
  if(S.ammo<=0){AU.click();showHint('冇子彈喇，㩒左上角換彈器');return;}
  var curDist0=curDist();   /* 開槍前嘅距離（轉階段提示用） */
  var ex=S.alignX+S.swaySX, ey=S.alignY+S.swaySY;
  var hdy=holdDy();   /* 瞄準法：理想準星位置偏移 */
  var bx=(S.lockX-TX())/TW(), by=(S.lockY-L.ty)/TH();
  /* 物理：同樣瞄準角度偏差，彈着點偏移 ∝ 距離（25米為基準） */
  var dk=curDist()/25;
  var hx=bx+ex*K_SIGHT*dk+gauss()*0.004*dk;
  var hy=by+(ey-hdy)*K_SIGHT*dk+gauss()*0.004*dk;
  var onPaper=hx>=0&&hx<=1&&hy>=0&&hy<=1;
  var hit=onPaper&&pointInPolygon(hx,hy,POLY);
  S.fired++;
  S.holes.push({x:hx,y:hy,hit:hit,n:S.fired,off:!onPaper});
  if(hit)S.hits++;
  /* 轉階段提示＋槍支自動指回靶心 */
  var nd=stageDist(S.fired);
  if(nd!==curDist0){S.hint=nd+' 米！';S.hintT=2.5;aimAtTargetCenter();}
  S.ammo--;
  S.flash=1;S.recoil=1;
  AU.shoot8();   /* 80年代 8-bit 槍聲 */
  if(hit){AU.hit();addPopup('命中 +1','#7cfc98');}
  else{addPopup(onPaper?'脫靶':'射出靶紙外','#ff8a80');}
  if(onPaper)S.puffs.push({x:hx,y:hy,t:0});
  spawnSmoke();
  if(S.fired>=TOTAL){endTest('42 發射擊完畢');}
  else if(S.ammo===0){showHint('㩒左上角換彈器入子彈');}
}
function spawnSmoke(){
  var i;for(i=0;i<7;i++){S.smoke.push({x:(Math.random()-0.5)*14,y:-10-Math.random()*10,vx:(Math.random()-0.5)*22,vy:-24-Math.random()*22,t:0,life:0.7+Math.random()*0.5,r:5+Math.random()*7});}
}
function cancelAim(){
  if(S.mode==='coarse'||S.mode==='fine'){S.mode='idle';}
  S.aimPid=null;
}
canvas.addEventListener('pointerdown',function(e){
  AU.resume();
  var x=e.clientX,y=e.clientY,i;
  if(S.screen==='start'){
    var i,hr0;
    if(S.showHelp){
      if(inRect(x,y,L.helpBackBtn)){S.showHelp=false;AU.init();AU.click();}
      return;
    }
    for(i=0;i<L.menuRects.length;i++){var mr=L.menuRects[i];if(inRect(x,y,mr)){
      AU.init();AU.resume();
      if(mr.act==='start'){S.menuSel='start';AU.start8();startGame();}
      else{S.menuSel='help';S.showHelp=true;AU.click();}
      return;
    }}
    for(i=0;i<L.holdRects.length;i++){hr0=L.holdRects[i];if(inRect(x,y,hr0)){S.hold=hr0.hold;AU.init();AU.click();return;}}
    return;
  }
  if(S.screen==='results'){if(inRect(x,y,L.restartBtn)){AU.init();AU.resume();S.screen='start';}return;}
  if(S.screen!=='play')return;
  /* 倒數下面兩個掣＋中央 RELOAD：優先處理 */
  if(inRect(x,y,L.stopBtn)){AU.click();endTest('手動停止');return;}
  if(inRect(x,y,L.againBtn)){AU.init();AU.resume();startGame();return;}
  if(S.endPhase)return;   /* 結束序列中：唔俾射擊／換彈，掣照用 */
  if(L.reloadRect&&inRect(x,y,L.reloadRect)){tryReload();return;}
  if(S.reloading)return;
  for(i=0;i<L.loaderRects.length;i++){if(inRect(x,y,L.loaderRects[i])){tryReload();return;}}
  if(y<L.HUD_Y||S.aimPid!==null)return;
  S.aimPid=e.pointerId;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  if(S.mode==='idle'){
    if(triggerHit(x,y)){firstTouch();pressTrigger();}
    else if(gunHit(x,y)){   /* 掂支槍任何部分都當握槍 */
      firstTouch();
      var p=clampTip(x,y);
      S.tipX=p.x;S.tipY=p.y;S.mode='coarse';S.hasCalibrated=true;
      AU.tick(1200);addPopup('已握槍','#ffd34d');   /* 明顯握槍反應 */
      showHint('拖動手指校準彈着點');
    }
    /* 其他位置唔做嘢：唔會誤觸 */
  }else if(S.mode==='locked'){
    var np=notchPos();
    if(triggerHit(x,y)||Math.hypot(x-np.x,y-np.y)<62){enterFine();}
    else if(gunHit(x,y)){
      var p2=clampTip(x,y);S.tipX=p2.x;S.tipY=p2.y;S.mode='coarse';
      showHint('拖動手指校準彈着點');
    }
  }
});
var lastMX=0,lastMY=0;
canvas.addEventListener('pointermove',function(e){
  if(e.pointerId!==S.aimPid)return;
  if(S.mode==='coarse'){
    var p=clampTip(e.clientX,e.clientY);
    S.tipX=p.x;S.tipY=p.y;
  }else if(S.mode==='fine'){
    var dx=e.clientX-lastMX,dy=e.clientY-lastMY;
    S.alignX=clamp(S.alignX+dx*FINE_SENS,-1.15,1.15);
    S.alignY=clamp(S.alignY+dy*FINE_SENS,-1.15,1.15);
  }
  lastMX=e.clientX;lastMY=e.clientY;
});
function aimUp(e){
  if(e.pointerId!==S.aimPid)return;
  S.aimPid=null;   /* 手勢結束一律清掉，唔係之後所有觸控都會被擋（卡死元兇） */
  if(S.mode==='coarse'){
    S.lockX=S.tipX;S.lockY=S.tipY;S.mode='locked';
    showHint('㩒照門（閃緊嗰圈）進入精瞄');
  }else if(S.mode==='fine'){fire();}
}
canvas.addEventListener('pointerup',aimUp);
canvas.addEventListener('pointercancel',aimUp);
canvas.addEventListener('pointerdown',function(e){lastMX=e.clientX;lastMY=e.clientY;});
canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){if(document.hidden)cancelAim();});

/* ================= 流程 ================= */
/* 第一次掂槍：開始倒數＋靶紙由背面反過來向住玩家 */
function firstTouch(){
  if(S.touched||S.screen!=='play')return;
  S.touched=true;S.timerOn=true;
  S.flipping=true;S.flipT=0;
  addPopup('計時開始','#ff6b60');
}
/* 槍指靶心：遊戲開始＋每次轉距離，槍支目標自動指住靶紙中心 */
function aimAtTargetCenter(){
  var cx=TX()+TW()/2, cy=L.ty+TH()/2;
  S.tipX=cx;S.tipY=cy;S.lockX=cx;S.lockY=cy;
}
function startGame(){resetState();aimAtTargetCenter();S.screen='play';S.warnT=2.6;AU.fanfare();}
function endTest(reason){
  S.endReason=reason;S.timerOn=false;
  S.mode='idle';S.aimPid=null;S.reloading=false;
  S.flip=1;   /* 確保靶紙係正面 */
  S.stats=computeStats();
  S.endT=2.0;
  if(reason==='時間到'){AU.buzz();S.endPhase='timeout';}   /* 開輪瓜 2秒 → 直接 Check Target */
  else{AU.fanfare();S.endPhase='showclear';}                 /* 開輪瓜＋SHOW CLEAR 2秒 → 槍消失 2秒 → Check Target */
}
function computeStats(){
  var holes=S.holes.filter(function(h){return !h.off;});
  var st={fired:S.fired,hits:S.hits,n:holes.length,empty:holes.length===0};
  if(st.empty)return st;
  st.mean=meanPoint(holes);
  var es=extremeSpread(holes,ASPECT);
  st.spread=es;st.spreadCM=es.d*CM_PER_Y;
  if(holes.length===1){st.spread={d:0,a:holes[0],b:holes[0]};st.spreadCM=0;}   /* 得一發：散佈為零 */
  var c=polyCentroid(POLY);
  var dx=(st.mean.x-c[0])*ASPECT*CM_PER_Y,dy=(st.mean.y-c[1])*CM_PER_Y;
  st.offCM=Math.hypot(dx,dy);
  var dir='';if(dx>0.8)dir+='右';else if(dx<-0.8)dir+='左';if(dy>0.8)dir+='下';else if(dy<-0.8)dir+='上';
  st.dir=dir||'置中';
  return st;
}

/* ================= 更新 ================= */
function update(dt,t){
  var i;
  /* 靶紙翻轉：掂槍嗰下，紙背 0.7 秒內翻向正面 */
  if(S.flipping){S.flipT+=dt;S.flip=Math.min(1,S.flipT/0.7);if(S.flip>=1){S.flipping=false;S.flip=1;}}
  /* 結束序列狀態機 */
  if(S.endPhase){
    S.endT-=dt;
    if(S.endT<=0){
      if(S.endPhase==='showclear'){S.endPhase='holster';S.endT=2.0;AU.click();}   /* 袋槍聲，槍支消失 */
      else{S.endPhase=null;S.screen='results';}
    }
  }
  if(S.warnT>0)S.warnT-=dt;
  if(S.screen==='play'&&S.timerOn){
    S.timeLeft-=dt;
    var s=Math.ceil(S.timeLeft);
    if(s<=5&&s>=1&&s!==S.lastBeep){S.lastBeep=s;AU.beep();}
    if(S.timeLeft<=0){S.timeLeft=0;endTest('時間到');return;}
  }
  /* 槍一舉起＝眼聚焦準星，靶紙即刻失焦模糊 */
  if(S.mode==='idle'){
    S.gunUp=Math.max(0,S.gunUp-dt*3);
    S.magA=Math.max(0,S.magA-dt*4);
    S.blurA=Math.max(0,S.blurA-dt*4);
  }else if(S.mode==='coarse'){
    S.gunUp=Math.min(1,S.gunUp+dt*6);
    S.magA=Math.min(1,S.magA+dt*4);
    S.blurA=Math.min(0.6,S.blurA+dt*5);
  }else if(S.mode==='locked'){
    S.gunUp=Math.min(1,S.gunUp+dt*6);
    S.magA=Math.max(0.35,S.magA-dt*2);
    S.blurA=Math.min(0.55,S.blurA+dt*5);
    S.notchT+=dt;
  }else if(S.mode==='fine'){
    S.fineT+=dt;
    S.gunUp=Math.min(1,S.gunUp+dt*6);
    S.magA=Math.min(1,S.magA+dt*5);
    S.blurA=Math.min(0.8,S.blurA+dt*5);
    S.fatigue=clamp((S.fineT-2.5)/6,0,1);
    var amp=0.16+S.fatigue*0.22;
    S.swaySX=amp*(Math.sin(1.9*t)+0.55*Math.sin(3.1*t+1.7))/1.55+0.02*Math.sin(12.7*t);
    S.swaySY=amp*(Math.sin(2.3*t+0.9)+0.55*Math.sin(3.7*t+2.4))/1.55+0.02*Math.sin(14.3*t+1);
  }
  S.recoil=Math.max(0,S.recoil-dt*5);
  S.flash=Math.max(0,S.flash-dt*9);
  for(i=S.puffs.length-1;i>=0;i--){S.puffs[i].t+=dt;if(S.puffs[i].t>0.5)S.puffs.splice(i,1);}
  for(i=S.popups.length-1;i>=0;i--){S.popups[i].t+=dt;if(S.popups[i].t>1.2)S.popups.splice(i,1);}
  for(i=S.smoke.length-1;i>=0;i--){var p=S.smoke[i];p.t+=dt;if(p.t>p.life){S.smoke.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=14*dt;}
  if(S.reloading){
    var rrt=(performance.now()-S.reloadT0)/S.reloadDur;   /* 真實時間計，慢機都唔會拉長 */
    S.reloadT=Math.min(rrt,1)*1.5;
    if(rrt>=1||performance.now()-S.reloadT0>5000){S.reloading=false;S.ammo=CYL;showHint('入滿 6 粒');}
  }
  if(S.hintT>0)S.hintT-=dt;
}

/* 子彈穿透紙張嘅彈孔：撕裂淺邊＋不規則黑洞＋放射狀小撕裂 */
function drawPiercedHole(px,py,r,seed){
  var i,a,X,Y,rr;
  ctx.fillStyle='#ddd3bf';
  ctx.beginPath();
  for(i=0;i<=10;i++){a=i/10*Math.PI*2;
    rr=r*(1.25+0.38*Math.sin(a*3+seed)+0.22*Math.cos(a*5+seed*2));
    X=px+Math.cos(a)*rr;Y=py+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#0a0a0c';
  ctx.beginPath();
  for(i=0;i<=10;i++){a=i/10*Math.PI*2;
    rr=r*(0.62+0.2*Math.sin(a*4+seed*3)+0.12*Math.cos(a*7+seed));
    X=px+Math.cos(a)*rr;Y=py+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(110,95,75,0.8)';ctx.lineWidth=Math.max(1,r*0.14);
  for(i=0;i<4;i++){a=seed*1.3+i*1.7;
    ctx.beginPath();ctx.moveTo(px+Math.cos(a)*r*0.9,py+Math.sin(a)*r*0.9);
    ctx.lineTo(px+Math.cos(a)*r*1.8,py+Math.sin(a)*r*1.8);ctx.stroke();}
}

/* 換彈：彈巢彈出＋子彈逐粒跌入 */
function drawReloadAnim(dx,dy,u){
  var rt=S.reloadT,sw=clamp(rt/0.25,0,1),bk=rt<1.15?0:clamp((rt-1.15)/0.35,0,1);
  var cx=dx-72*u,cy=dy+225*u;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-1.15*sw+1.15*bk);
  ctx.fillStyle=steelGrad(-46,46);rr(-46,-27,92,54,15);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2;rr(-46,-27,92,54,15);ctx.stroke();
  var a;for(a=0;a<6;a++){
    var ang=a*Math.PI/3-Math.PI/2;
    var chx=Math.cos(ang)*24,chy=Math.sin(ang)*24;
    var filled=(rt>0.45+a*0.11);
    ctx.fillStyle=filled?'#c9a227':'#07090b';
    ctx.beginPath();ctx.arc(chx,chy,8,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(chx,chy,8,0,7);ctx.stroke();
  }
  for(a=0;a<6;a++){
    var bt=rt-(0.45+a*0.11);
    if(bt>0&&bt<0.35){
      var ang2=a*Math.PI/3-Math.PI/2;
      var k=bt/0.35,rxx=Math.cos(ang2)*24,ryy=Math.sin(ang2)*24-130*(1-k)*(1-k);
      ctx.fillStyle='#e8c33a';rr(rxx-5,ryy-11,10,22,4);ctx.fill();
      ctx.strokeStyle='#7a5c14';ctx.lineWidth=1.5;rr(rxx-5,ryy-11,10,22,4);ctx.stroke();
    }
  }
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='700 15px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('換緊子彈…',L.W/2,L.H*0.72);
}

/* ================= 準星放大鏡（含晃動幅度） ================= */
function drawMagnifier(){
  if(S.magA<0.02||!blurC||!IMG.complete)return;
  var mx=L.mx,my=L.my,mr=L.mr;
  var tip=S.mode==='fine'?{x:S.lockX,y:S.lockY}:drawTip(),z=3.4,b=S.blurA;   /* 精瞄時放大鏡對準鎖定彈着點：真射手視角 */
  ctx.save();ctx.globalAlpha=S.magA;
  ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.clip();
  ctx.fillStyle='#0a0d11';ctx.fillRect(mx-mr,my-mr,mr*2,mr*2);
  ctx.save();
  ctx.translate(mx,my);ctx.scale(z,z);ctx.translate(-tip.x,-tip.y);
  ctx.globalAlpha=(1-b)*S.magA;ctx.drawImage(sharpC,TX(),L.ty,TW(),TH());
  ctx.globalAlpha=b*S.magA;ctx.drawImage(blurC,TX(),L.ty,TW(),TH());
  ctx.globalAlpha=S.magA;
  var i,h;for(i=0;i<S.holes.length;i++){h=S.holes[i];if(h.off)continue;
    ctx.fillStyle='rgba(8,8,10,0.9)';
    ctx.beginPath();ctx.arc(TX()+h.x*TW(),L.ty+h.y*TH(),1.8,0,7);ctx.fill();}
  ctx.restore();
  /* 射手視角：透過後照門缺口望出去——前準星升起喺缺口正中，遠方靶紙喺後面 */
  var ex=S.mode==='fine'?S.alignX+S.swaySX:0;
  var ey=S.mode==='fine'?S.alignY+S.swaySY:0;
  var px=ex*13,py=ey*13;   /* 物理一致：ex=1 ⟺ 準星剛好偏出照門缺口 */
  var z2=mr/95;
  var ry=my+mr*0.18;                       /* 照門頂緣 */
  var nw=15*z2;                            /* 缺口半闊：ex=1 ⟺ 準星剛好偏出 */
  /* 後照門剪影＋ U 形缺口：金屬實在感，精瞄時固定唔郁（100% 似真槍） */
  var rmg=ctx.createLinearGradient(0,ry,0,my+mr);
  rmg.addColorStop(0,'#2a313b');rmg.addColorStop(0.4,'#161b22');rmg.addColorStop(1,'#0b0e13');
  ctx.fillStyle=rmg;
  ctx.fillRect(mx-mr-4,ry,(mx-nw)-(mx-mr-4),my+mr-ry+4);
  ctx.fillRect(mx+nw,ry,(mx+mr+4)-(mx+nw),my+mr-ry+4);
  ctx.fillRect(mx-nw,ry+36*z2,2*nw,my+mr-ry);
  ctx.fillStyle='rgba(255,255,255,0.10)';  /* 頂緣高光 */
  ctx.fillRect(mx-mr-4,ry,(mx-nw)-(mx-mr-4),2*z2);
  ctx.fillRect(mx+nw,ry,(mx+mr+4)-(mx+nw),2*z2);
  ctx.fillStyle='rgba(255,211,77,0.9)';    /* 缺口兩邊刻度 */
  ctx.fillRect(mx-nw-1*z2,ry-10*z2,2*z2,10*z2);
  ctx.fillRect(mx+nw-1*z2,ry-10*z2,2*z2,10*z2);
  ctx.fillStyle='#e8ecf2';                 /* 照門白點 */
  ctx.beginPath();ctx.arc(mx-nw-11*z2,ry+17*z2,3.2*z2,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(mx+nw+11*z2,ry+17*z2,3.2*z2,0,7);ctx.fill();
  /* 前準星：部門圖風格——黑柱＋紅頂＋白點（柱身按 err 變色提示） */
  var err=Math.hypot(ex,ey-holdDy());   /* 按瞄準法調整理想位置 */
  var pw2=7.5*z2,ph=60*z2,pyy=ry-32*z2+py;
  var fsx=mx+px;
  var scol=S.mode==='fine'
    ?(err<0.25?'#3ddc84':(err<0.7?'#ffd34d':'#ff6b5e'))   /* 綠=瞄正可射，黃=偏，紅=大偏 */
    : '#ffd34d';   /* 粗瞄只顯示槍口指向，唔用發射顏色 */
  ctx.fillStyle='#111111';   /* 黑柱本體（部門圖風格） */
  ctx.fillRect(fsx-pw2,pyy,pw2*2,ph);
  ctx.fillStyle='#e02020';   /* 紅頂 */
  ctx.beginPath();ctx.arc(fsx,pyy,pw2,Math.PI,0);ctx.fill();
  ctx.fillRect(fsx-pw2,pyy-pw2*0.5,pw2*2,pw2*0.5);
  ctx.fillStyle='#ffffff';   /* 白點 */
  ctx.beginPath();ctx.arc(fsx,pyy+ph*0.55,pw2*0.55,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.65)';ctx.lineWidth=1.5;
  ctx.strokeRect(fsx-pw2,pyy,pw2*2,ph);
  ctx.fillStyle=scol;   /* 瞄準狀態燈：綠=瞄正可射，黃=偏，紅=大偏 */
  ctx.beginPath();ctx.arc(fsx,pyy+ph+11*z2,5.5*z2,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(fsx,pyy+ph+11*z2,5.5*z2,0,7);ctx.stroke();
  ctx.restore();
  /* 框＋標籤：粗瞄時加粗發光，話你知支槍指緊邊 */
  ctx.save();ctx.globalAlpha=S.magA;
  ctx.beginPath();ctx.arc(mx,my,mr,0,7);
  if(S.mode==='coarse'){
    ctx.strokeStyle='rgba(255,211,77,1)';ctx.lineWidth=5;ctx.stroke();
    ctx.strokeStyle='rgba(255,211,77,0.35)';ctx.lineWidth=10;ctx.stroke();
  }else{
    ctx.strokeStyle='rgba(255,211,77,0.85)';ctx.lineWidth=2.5;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(mx,my,mr-5,0,7);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='rgba(255,211,77,0.9)';ctx.font='700 11px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(S.mode==='coarse'?'槍口指向':'準星放大',mx,my-mr+11);
  ctx.restore();
}

function drawSightPicture(g,hx,hy,hr,hold){

function drawPixelCover(topH){
  var W=L.W;
  var ready=IMG.complete&&IMG.naturalWidth>0;   /* 靶紙圖 */
  var key=W+'x'+Math.round(topH)+(ready?'1':'0');
  if(!pixelCoverC||pixelCoverC._key!==key){
    var pw=Math.max(48,Math.ceil(W/4)),ph=Math.max(36,Math.ceil(topH/4));
    pixelCoverC=document.createElement('canvas');
    pixelCoverC.width=pw;pixelCoverC.height=ph;pixelCoverC._key=key;
    var g=pixelCoverC.getContext('2d'),i;
    g.fillStyle='#f6f6f1';g.fillRect(0,0,pw,ph);   /* 白底封面（紅白機風） */
    if(ready){
      /* 靶紙做主題：80年代任天堂開機起格 mosaic */
      var cells=44;
      var th2=Math.max(8,Math.round(cells*IMG.naturalHeight/IMG.naturalWidth));
      var tiny=document.createElement('canvas');tiny.width=cells;tiny.height=th2;
      tiny.getContext('2d').drawImage(IMG,0,0,cells,th2);
      var cw2=Math.ceil(pw/cells);
      var tw=cells*cw2,th=th2*cw2;
      var sc2=Math.min(1,(ph-8)/th);
      tw=Math.round(tw*sc2);th=Math.round(th*sc2);
      var dx=Math.round((pw-tw)/2),dy=Math.round((ph-th)/2);
      g.imageSmoothingEnabled=false;
      g.drawImage(tiny,dx,dy,tw,th);
      g.imageSmoothingEnabled=true;
      /* 紅白機式粗框 */
      g.fillStyle='#e60012';
      g.fillRect(dx-2,dy-2,tw+4,2);g.fillRect(dx-2,dy+th,tw+4,2);
      g.fillRect(dx-2,dy,2,th+2);g.fillRect(dx+tw,dy,2,th+2);
    }else{
      /* 圖未 load：紅色速度線打底 */
      var cols=['#e60012','#ff6b5e','#a00010','#ff9a8a','#c00020'];
      for(i=0;i<70;i++){
        g.fillStyle=cols[i%cols.length];
        g.fillRect(Math.random()*pw,Math.random()*ph,3+Math.random()*12,1);
      }
    }
  }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(pixelCoverC,0,0,W,topH);
  ctx.imageSmoothingEnabled=true;
}

  ctx.fillStyle='rgba(2,4,8,0.62)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(S.endPhase==='holster'){
    /* 槍支已消失 */
    ctx.fillStyle='#7cfc98';ctx.font='900 28px '+NESF;
    ctx.fillText('已袋槍',cx,H*0.38);
    ctx.fillStyle='#9fb0c3';ctx.font='15px '+FONT;
    ctx.fillText('準備驗靶…',cx,H*0.38+40);
    return;
  }
  /* 彈巢打開圖：槍管向右，彈巢向左擺出（6 個空彈膛） */
  var s=Math.min(W*0.40,190),a;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#1c2026';rr(-s*0.10,-s*0.09,s*0.70,s*0.18,8);ctx.fill();   /* 槍身 */
  ctx.fillStyle='#3d444e';rr(s*0.42,-s*0.06,s*0.28,s*0.12,6);ctx.fill();     /* 槍管 */
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(-s*0.10,-s*0.09,s*0.70,3);
  ctx.strokeStyle='#1c2026';ctx.lineWidth=Math.max(4,s*0.045);               /* 扳機護圈 */
  ctx.beginPath();ctx.arc(-s*0.02,s*0.24,s*0.13,0,7);ctx.stroke();
  ctx.fillStyle='#6e3c1d';rr(-s*0.16,s*0.30,s*0.22,s*0.30,10);ctx.fill();    /* 握把 */
  ctx.save();ctx.translate(-s*0.42,0);ctx.rotate(-0.30);                    /* 彈巢擺出 */
  var cg=ctx.createLinearGradient(0,-s*0.30,0,s*0.30);
  cg.addColorStop(0,'#4a525c');cg.addColorStop(0.5,'#22272e');cg.addColorStop(1,'#101318');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,s*0.30,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,s*0.30,0,7);ctx.stroke();
  for(a=0;a<6;a++){
    var ang=a*Math.PI/3-Math.PI/2;
    var hx=Math.cos(ang)*s*0.17,hy=Math.sin(ang)*s*0.17;
    ctx.fillStyle='#05070a';ctx.beginPath();ctx.arc(hx,hy,s*0.075,0,7);ctx.fill();
    ctx.strokeStyle='#c9a227';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(hx,hy,s*0.075,0,7);ctx.stroke();
  }
  ctx.fillStyle='#05070a';ctx.beginPath();ctx.arc(0,0,s*0.05,0,7);ctx.fill();
  ctx.restore();
  ctx.restore();
  /* 警示字 */
  var wy=cy+s*0.66;
  if(S.endPhase==='showclear'){
    var bw=Math.min(W*0.80,340),bh=96;
    ctx.fillStyle='rgba(20,8,4,0.94)';rr(cx-bw/2,wy-bh/2,bw,bh,12);ctx.fill();
    ctx.strokeStyle='#ff6b5e';ctx.lineWidth=3;rr(cx-bw/2,wy-bh/2,bw,bh,12);ctx.stroke();
    ctx.fillStyle='#ffd34d';ctx.font='900 30px '+NESF;
    ctx.fillText('SHOW CLEAR',cx,wy-17);
    ctx.fillStyle='#ffffff';ctx.font='700 22px '+FONT;
    ctx.fillText('袋槍！',cx,wy+23);
  }else{   /* timeout */
    ctx.fillStyle='#ffd34d';ctx.font='900 28px '+NESF;
    ctx.fillText('時間到',cx,wy-12);
    ctx.fillStyle='#cfd8e3';ctx.font='16px '+FONT;
    ctx.fillText('打開輪瓜，準備驗靶…',cx,wy+26);
  }
}

function drawResults(){
  var W=L.W,H=L.H;
  ctx.fillStyle='rgba(4,8,12,0.92)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffd34d';ctx.font='700 24px '+FONT;
  ctx.fillText('CHECK TARGET',W/2,40);
  ctx.fillStyle='#9fb0c3';ctx.font='14px '+FONT;
  ctx.fillText(S.endReason,W/2,66);
  if(W<H){   /* 直屏：靶紙上、計分下 */
    var panelTop=H-250,panelH=158;
    var pw=Math.min(W*0.92,560),ph=pw*(IMG_H/IMG_W),py=92;
    var maxPh=panelTop-py-26;
    if(ph>maxPh&&maxPh>140){ph=maxPh;pw=ph/(IMG_H/IMG_W);}
    var px=(W-pw)/2;
    drawResultPaper(px,py,pw,ph);
    ctx.fillStyle='#6b7a8d';ctx.font='11px '+FONT;ctx.textAlign='center';
    ctx.fillText('藍十字＝平均彈着點・綠點＝人物中心・黃圈＝散佈範圍',W/2,panelTop-13);
    drawResultStats(14,panelTop,W-28,panelH);
  }else{   /* 橫屏：靶紙左、計分右 */
    var ph2=H-84-16,py2=84,pw2=ph2/(IMG_H/IMG_W);
    if(pw2>W*0.42){pw2=W*0.42;ph2=pw2*(IMG_H/IMG_W);}
    var px2=Math.max(16,(W*0.44-pw2)/2);
    drawResultPaper(px2,py2,pw2,ph2);
    drawResultStats(W*0.44+8,py2,W-(W*0.44+8)-16,170);   /* 170 啱啱好裝晒 6 行，唔會掂到底部掣 */
  }
  drawButton(L.restartBtn,'重新練習','#2f9e44','#1f7a33');
}

/* ================= 主循環 ================= */
var t0=0,lastT=0;
function frame(ts){
  try{
    var t=ts/1000,dt=Math.min(0.05,t-(lastT||t));lastT=t;t0=t;
    update(dt,t);
    ctx.clearRect(0,0,L.W,L.H);
    if(S.screen==='play'){
      drawRange(t);drawHanger();drawTargetPaper();drawPuffs();
      if(S.endPhase){
        /* 結束序列：乾淨畫面，只留靶場＋槍（未袋前）＋HUD＋結束覆蓋層 */
        if(S.endPhase!=='holster')drawGun();   /* 袋槍後槍支消失 */
        drawSmoke();drawFlash();
        drawHUD();drawEndSequence();
      }else{
        drawGun();drawNotchPrompt();drawReloadFinger(t);
        drawSmoke();drawFlash();drawMagnifier();
        drawHUD();drawPlayBtns();drawHintPopups();drawIdleHint(t);drawReloadMsg(t);drawWarn();
      }
    }else if(S.screen==='results'){drawResults();}
    else{drawRange(t);drawHanger();drawTargetPaper();drawStart();}
  }catch(err){
    if(window.console&&console.warn)console.warn('frame',err);
  }
  requestAnimationFrame(frame);   /* 例外都唔會停 loop，畫面永不卡死 */
}

/* ================= 啟動 ================= */
IMG.onload=function(){buildTarget();};
IMG.onerror=function(){S.screen='start';};
IMG.src='data:image/jpeg;base64,'+TARGET_B64;
resize();
resetState();
S.screen='start';
requestAnimationFrame(frame);
</script>
